<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Öffnen</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 17px -apple-system, system-ui, sans-serif; margin: 0; padding: 28px 20px;
         background: #f6f5f2; color: #1d1d1f; }
  @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #f2f2f7; } .card { background: #2c2c2e !important; border-color: #3a3a3c !important; } }
  .card { background: #fff; border: 1px solid #e2e0da; border-radius: 16px; padding: 20px; max-width: 520px; margin: 0 auto; }
  .ordner { font-size: 13px; color: #8e8e93; margin: 0 0 6px; word-break: break-word; }
  .datei { font-size: 18px; font-weight: 600; margin: 0 0 20px; word-break: break-word; }
  a.haupt { display: block; text-align: center; padding: 16px; border-radius: 12px; background: #0a84ff;
            color: #fff; text-decoration: none; font-weight: 600; font-size: 17px; }
  a.neben { display: block; text-align: center; padding: 14px; margin-top: 10px; color: #0a84ff; text-decoration: none; font-size: 15px; }
  .fehler { color: #c0392b; }
</style>
</head>
<body>
<div class="card" id="karte">
  <p class="datei">Wird geöffnet …</p>
</div>

<script>
(function () {
  // Wurzel: iCloud Drive / 2 Immobilien. Der Pfad hinter dem # ist relativ dazu
  // (wie dokument.pfad im Asset Manager). Der Teil hinter # wird nie an den Server geschickt.
  var WURZEL = "shareddocuments:///private/var/mobile/Library/Mobile%20Documents/com~apple~CloudDocs/2%20Immobilien/";
  var karte = document.getElementById("karte");

  function zeigeFehler(text) {
    karte.innerHTML = '<p class="datei fehler"></p>';
    karte.firstChild.textContent = text;
  }

  var roh = location.hash.slice(1);
  if (!roh) { zeigeFehler("Kein Pfad angegeben."); return; }

  var pfad;
  try { pfad = decodeURIComponent(roh); } catch (e) { zeigeFehler("Pfad nicht lesbar."); return; }

  var teile = pfad.split("/").filter(function (t) { return t.length > 0; });
  if (teile.length === 0 || teile.some(function (t) { return t === ".." || t === "."; })) {
    zeigeFehler("Ungültiger Pfad."); return;
  }

  function ziel(segmente) {
    return WURZEL + segmente.map(encodeURIComponent).join("/");
  }

  var istDatei = /\.[A-Za-z0-9]{1,5}$/.test(teile[teile.length - 1]);
  var zielUrl = ziel(teile);
  var ordnerTeile = istDatei ? teile.slice(0, -1) : teile;

  karte.innerHTML =
    '<p class="ordner"></p><p class="datei"></p>' +
    '<a class="haupt" id="los"></a>' +
    (istDatei && ordnerTeile.length ? '<a class="neben" id="ordner">Ordner öffnen</a>' : '');

  karte.querySelector(".ordner").textContent = ordnerTeile.join(" › ");
  karte.querySelector(".datei").textContent = istDatei ? teile[teile.length - 1] : "Ordner";
  var los = document.getElementById("los");
  los.textContent = istDatei ? "In Dateien öffnen" : "Ordner öffnen";
  los.href = zielUrl;
  var o = document.getElementById("ordner");
  if (o) o.href = ziel(ordnerTeile);

  document.title = istDatei ? teile[teile.length - 1] : "Ordner";

  // Direkt weiterleiten; falls der Browser das ohne Tippen blockiert, bleibt der Knopf.
  location.href = zielUrl;
})();
</script>
</body>
</html>
